<svg xmlns="http://www.w3.org/2000/svg" width="260" height="74" viewBox="0 0 260 74" role="img" aria-labelledby="title desc">
  <title id="title">OpenMC Plasma Source</title>
  <desc id="desc">Stylized toroidal plasma source with fusion emission rays</desc>
  <defs>
    <linearGradient id="plasma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="260" height="74" rx="4" fill="#343131"/>

  <!-- Toroidal plasma cross-section. -->
  <g transform="translate(36 37)" fill="none" stroke-linecap="round" filter="url(#glow)">
    <ellipse rx="25" ry="14" stroke="url(#plasma)" stroke-width="5" transform="rotate(-16)"/>
    <ellipse rx="25" ry="14" stroke="#bae6fd" stroke-opacity="0.75" stroke-width="1.5" transform="rotate(16)"/>
    <ellipse rx="10" ry="5" stroke="#343131" stroke-width="5"/>
    <ellipse rx="10" ry="5" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="1.2"/>
  </g>

  <!-- Fusion/neutron emission points. -->
  <g fill="#fbbf24" filter="url(#glow)">
    <circle cx="20" cy="28" r="2.1"/>
    <circle cx="49" cy="29" r="1.8"/>
    <circle cx="27" cy="48" r="1.8"/>
    <circle cx="48" cy="45" r="2.0"/>
  </g>
  <text x="70" y="33" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="600">OpenMC</text>
  <text x="71" y="53" fill="#67e8f9" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.1">PLASMA SOURCE</text>
</svg>
